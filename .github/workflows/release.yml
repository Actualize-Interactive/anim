name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup cmake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.26.0'

    - name: Cache CMake Build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.ccache
          ~/Library/Caches/ccache # macOS
          ~\AppData\Local\ccache  # Windows
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DANIM_BUILD_TESTS=ON -DANIM_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure

    # Create platform-specific archives (buildable source: headers + sources +
    # CMake config, so the release can be built via add_subdirectory or standalone)
    - name: Create Archive (Unix)
      if: matrix.os != 'windows-latest'
      run: zip -r anim-release-${{ matrix.os }}.zip include src cmake CMakeLists.txt README.md LICENSE CONTRIBUTING.md

    - name: Create Archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: Compress-Archive -Path include,src,cmake,CMakeLists.txt,README.md,LICENSE,CONTRIBUTING.md -DestinationPath anim-release-${{ matrix.os }}.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: anim-release-${{ matrix.os }}
        path: anim-release-${{ matrix.os }}.zip
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/anim-release-ubuntu-latest/anim-release-ubuntu-latest.zip
          artifacts/anim-release-macos-latest/anim-release-macos-latest.zip
          artifacts/anim-release-windows-latest/anim-release-windows-latest.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
