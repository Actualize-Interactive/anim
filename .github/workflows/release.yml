name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup cmake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.26.0'

    - name: Cache CMake Build
      uses: actions/cache@v3
      with:
        path: |
          build
          ~/.ccache
          ~/Library/Caches/ccache # macOS
          ~\AppData\Local\ccache  # Windows
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure

    # Create platform-specific archives
    - name: Create Archive (Unix)
      if: matrix.os != 'windows-latest'
      run: zip -r anim-release-${{ matrix.os }}.zip include README.md LICENSE

    - name: Create Archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: Compress-Archive -Path include,README.md,LICENSE -DestinationPath anim-release-${{ matrix.os }}.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: anim-release-${{ matrix.os }}
        path: anim-release-${{ matrix.os }}.zip
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/anim-release-ubuntu-latest/anim-release-ubuntu-latest.zip
          artifacts/anim-release-macos-latest/anim-release-macos-latest.zip
          artifacts/anim-release-windows-latest/anim-release-windows-latest.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
