name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and test on every platform as the release gate.
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup cmake
      uses: lukka/get-cmake@v4.4.0
      with:
        cmakeVersion: '4.4.0'

    - name: Cache CMake Build
      uses: actions/cache@v6
      with:
        path: |
          build
          ~/.ccache
          ~/Library/Caches/ccache # macOS
          ~\AppData\Local\ccache  # Windows
        key: ${{ runner.os }}-cmake4.4.0-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake4.4.0-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DANIM_BUILD_TESTS=ON -DANIM_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure

  # Package a single source archive and publish the release.
  #
  # Only runs for tag pushes. A release cannot be published from a branch, so on
  # workflow_dispatch this job is skipped and the workflow acts as a dry run of
  # the cross-platform build and test gate above.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Squash-merging a pull request rewrites the commit, so a tag pushed to the
    # pre-merge branch tip builds and tests green while pointing at a commit
    # reachable only from the tag. Publishing that produces a release whose
    # history is not on main, which is only noticed much later by whoever pins
    # it. Refuse the tag instead.
    - name: Verify the tag is on main
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
          echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main. Delete the tag, then re-tag the merged commit on main." >&2
          exit 1
        fi
        echo "$GITHUB_REF_NAME is on main."

    # One platform-independent, buildable source archive (headers + sources +
    # CMake config). GitHub also attaches auto-generated "Source code" archives.
    - name: Package source archive
      run: zip -r anim-${{ github.ref_name }}-src.zip include src cmake CMakeLists.txt README.md LICENSE CONTRIBUTING.md CHANGELOG.md

    # Use the CHANGELOG entry for this tag as the release body, so the notes are
    # written once and reviewed in the pull request that introduced them.
    - name: Extract release notes from CHANGELOG
      run: |
        version="${GITHUB_REF_NAME#v}"
        # Match the heading by prefix rather than by regex: a version string
        # interpolated into a regex turns "[0.3.0]" into a character class, and
        # whether the escaping survives depends on the awk in use (mawk keeps
        # the backslash, gawk drops it and silently matches nothing).
        awk -v head="## [$version]" '
          index($0, head) == 1      { found = 1; next }  # heading for this version
          found && index($0, "## [") == 1 { exit }       # next version heading
          found && /^\[.*\]: /      { exit }             # link reference block
          found && index($0, "<!--") == 1 { exit }       # trailing comments
          found                     { print }
        ' CHANGELOG.md \
          | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;};/\n$/ba' > RELEASE_NOTES.md

        if [ ! -s RELEASE_NOTES.md ]; then
          echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging $GITHUB_REF_NAME." >&2
          exit 1
        fi
        echo "Release notes for $version:"
        cat RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: anim-${{ github.ref_name }}-src.zip
        name: Release ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
        draft: false
        prerelease: false
