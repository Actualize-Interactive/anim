name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and test on every platform as the release gate.
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup cmake
      uses: lukka/get-cmake@v4.4.0
      with:
        cmakeVersion: '4.4.0'

    - name: Cache CMake Build
      uses: actions/cache@v6
      with:
        path: |
          build
          ~/.ccache
          ~/Library/Caches/ccache # macOS
          ~\AppData\Local\ccache  # Windows
        key: ${{ runner.os }}-cmake4.4.0-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake4.4.0-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DANIM_BUILD_TESTS=ON -DANIM_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure

  # Package a single source archive and publish the release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    # One platform-independent, buildable source archive (headers + sources +
    # CMake config). GitHub also attaches auto-generated "Source code" archives.
    - name: Package source archive
      run: zip -r anim-${{ github.ref_name }}-src.zip include src cmake CMakeLists.txt README.md LICENSE CONTRIBUTING.md CHANGELOG.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: anim-${{ github.ref_name }}-src.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
