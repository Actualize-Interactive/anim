name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Setup cmake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.26.0'

    - name: Cache CMake Build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.ccache
          ~/Library/Caches/ccache # macOS
          ~\AppData\Local\ccache  # Windows
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DANIM_BUILD_TESTS=ON -DANIM_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure
